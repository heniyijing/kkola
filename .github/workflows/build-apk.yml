name: Build RedTeam APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          SDKMAN=$(find /usr/local/lib/android /opt/android* "$HOME/Android" -maxdepth 6 -name sdkmanager -type f 2>/dev/null | head -1)
          if [ -z "$SDKMAN" ]; then SDKMAN="$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager"; fi
          echo "using sdkmanager: $SDKMAN"
          yes | "$SDKMAN" --licenses > /dev/null 2>&1 || true
          "$SDKMAN" "platforms;android-34" "build-tools;34.0.0" "platform-tools"

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.13'

      - name: Build debug APK
        run: gradle :app:assembleDebug --no-daemon

      - uses: actions/upload-artifact@v4
        with:
          name: redteam-debug-apk
          path: app/build/outputs/apk/debug/*.apk
