plugins {
    id 'com.android.application'
}

android {
    namespace 'com.milai.redteam'
    compileSdk 34

    defaultConfig {
        applicationId "com.milai.redteam"
        minSdk 26
        targetSdk 34
        versionCode 1
        versionName "1.0"
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    // Shizuku. 如果构建机不能访问 mavenCentral，把 AAR 放进 app/libs/
    // 并把下面这行换成 implementation fileTree(dir: 'libs', include: ['*.aar'])
    implementation 'dev.rikka.shizuku:api:13.1.5'
    implementation 'dev.rikka.shizuku:provider:13.1.5'
}
